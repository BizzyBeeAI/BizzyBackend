name: Backend delivery
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      APP_ENV: test
      BIZZY_MODEL_PROVIDER: disabled
      BIZZY_SCENARIO_DATA_DIR: /tmp/bizzy-scenarios
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: |
          python scripts/verify_data.py
          mkdir -p /tmp/bizzy-scenarios
          tar -xzf docker/bizzydata-demo.tar.gz -C /tmp/bizzy-scenarios
          pytest -q
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: '1.15.3'
      - run: |
          terraform fmt -check -recursive infra
          for root in bootstrap runtime budget; do
            terraform -chdir=infra/$root init -backend=false -lockfile=readonly -input=false
            terraform -chdir=infra/$root validate
          done
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - run: |
          docker buildx build --platform linux/amd64 --provenance=false --load -f Dockerfile.lambda --build-arg BACKEND_COMMIT="$GITHUB_SHA" -t bizzybackend:test .
          docker run -d --name bizzy-smoke -p 9000:8080 -e APP_ENV=test -e BIZZY_MODEL_PROVIDER=disabled bizzybackend:test
          python scripts/smoke_container.py
          docker stop bizzy-smoke
          docker save bizzybackend:test -o image.tar
          sha256sum image.tar > image.tar.sha256
      - name: Scan image with checksum-pinned Trivy
        run: bash scripts/scan_image.sh image.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backend-image-${{ github.sha }}
          path: |
            image.tar
            image.tar.sha256
          retention-days: 7
          if-no-files-found: error
  deploy:
    if: ${{ false }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: poc
    concurrency:
      group: bizzybee-backend-poc
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-1
      ECR_REPOSITORY: 524097108092.dkr.ecr.ap-southeast-1.amazonaws.com/bizzybee-poc-backend
      API_ORIGIN: ${{ vars.API_ORIGIN }}
      FRONTEND_COMMIT: ${{ vars.FRONTEND_COMMIT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install boto3==1.42.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: backend-image-${{ github.sha }}
      - run: |
          test -n "$API_ORIGIN"
          [[ "$FRONTEND_COMMIT" =~ ^[a-f0-9]{40}$ ]]
          sha256sum -c image.tar.sha256
          docker load -i image.tar
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1
          allowed-account-ids: '524097108092'
      - run: |
          aws ecr get-login-password | docker login --username AWS --password-stdin 524097108092.dkr.ecr.ap-southeast-1.amazonaws.com
          TAG="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag bizzybackend:test "$ECR_REPOSITORY:$TAG"
          docker push "$ECR_REPOSITORY:$TAG"
          DIGEST=$(aws ecr describe-images --repository-name bizzybee-poc-backend --image-ids imageTag="$TAG" --query 'imageDetails[0].imageDigest' --output text)
          IMAGE_URI="$ECR_REPOSITORY@$DIGEST" python scripts/deploy_backend.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: backend-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release.json
          retention-days: 90
